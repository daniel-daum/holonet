config_file_path = ""

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/holonet/"
  delay = 1000
  exclude_file = []
  exclude_dir = ["tmp", "bin"]
  exclude_regex = []
  ignore = ["_test.go"]
  send_before = false
  stop_on_error = false

[log]
  time = false

[color]
  main = "magenta"
  runner = "yellow"
  build = "red"
  app = "green"

[misc]
  clean_on_exit = true
